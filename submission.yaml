submission:
  title: "GridSentinel AI: Outage Prediction & Equipment Failure Copilot"  # REQUIRED
  
  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Power transformer and substation failures cause sudden regional blackouts costing utilities over
    $1M per hour and disrupting critical infrastructure like hospitals and transit grids. Traditional
    calendar-based maintenance misses early failure signatures in sensor data (DGA gases, oil
    temperature, mechanical vibration) that rapidly compound during severe weather events.
    
  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    GridSentinel unifies real-time transformer health telemetry (IEEE C57.104 DGA gas standards) with live
    meteorological storm forecasts and grid topology criticality. Powered by IBM Bob IDE and IBM watsonx.ai
    Granite 3.0, it predicts failure-prone assets weeks in advance and autonomously synthesizes emergency
    load-shifting directives and crew pre-positioning work orders.
    
  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "IEEE C57.104 Dissolved Gas Analysis (DGA) arcing and thermal runaway detection"
    - "Dynamic weather severity compounding multiplier factoring wind gusts and heatwave stress"
    - "Topological grid impact scoring (0-100) prioritizing critical loads like hospitals and transit"
    - "Autonomous emergency crew pre-positioning and staging work-order generation via IBM Granite 3.0"
    - "Interactive real-time React diagnostic dashboard with risk distribution visualizations, animated health gauges, and one-click dispatch exports"
    
  tech_stack:
    languages: ["Python", "JavaScript"]              # REQUIRED — exact languages used in src/
    frameworks: ["FastAPI", "React", "TailwindCSS", "Recharts"]
    ibm_technologies: ["IBM Bob IDE", "IBM watsonx.ai", "IBM Granite 3.0"]
    databases: ["JSON Data Store"]
    other: ["IEEE C57.104 Standard", "Vite", "GitHub Actions"]
    
  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of bridging the gap between rigorous IEEE C57.104 electrical engineering
    diagnostics and generative AI. Instead of just producing generic text, our solution uses IBM Granite 3.0
    to translate complex multi-variable physics and meteorological data into actionable, dispatch-ready
    crew pre-positioning work orders that save millions in emergency downtime.
    
  known_limitations: >                 # Optional but recommended — be honest about gaps
    Currently, the system ingests batch telemetry feeds rather than continuous Substation SCADA IEC 61850
    streams. Real-time dynamic line rating (DLR) integration is slated for future development beyond the hackathon.


